<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Single trapezoidal star arm with rounded corners -->
    <path id="star-arm" d="
      M -11, -30
      L -17, -90
      A 5 5 0 0 1 -12, -95
      L 12, -95
      A 5 5 0 0 1 17, -90
      L 11, -30
      A 4 4 0 0 1 7, -26
      L -7, -26
      A 4 4 0 0 1 -11, -30
      Z"
      fill="#FF662A"
    />
  </defs>
  <g transform="translate(100, 100)">
    <use href="#star-arm" />
    <use href="#star-arm" transform="rotate(72)" />
    <use href="#star-arm" transform="rotate(144)" />
    <use href="#star-arm" transform="rotate(216)" />
    <use href="#star-arm" transform="rotate(288)" />
  </g>
</svg>
